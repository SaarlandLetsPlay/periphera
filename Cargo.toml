[package]
name = "periphera"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Zentrale Verwaltung von Peripheriegeräten: DPI, Beleuchtung, Makros"
repository = "https://github.com/SaarlandLetsPlay/periphera"

[dependencies]
eframe = "0.37.0"
evdev = "0.13.2"
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[package.metadata.deb]
maintainer = "SaarlandLetsPlay"
copyright = "2026, SaarlandLetsPlay"
license-file = ["LICENSE", "0"]
extended-description = "Zentrale Verwaltung von Peripheriegeräten unter Linux: DPI, Beleuchtung mit Effekten und Tastenmakros."
section = "utils"
priority = "optional"
assets = [
    ["target/release/periphera", "usr/bin/", "755"],
    ["packaging/periphera.desktop", "usr/share/applications/", "644"],
    ["packaging/periphera.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/70-periphera.rules", "usr/lib/udev/rules.d/", "644"],
]
